# Clinic AI Assistant — Render Blueprint (free tier first).
# In the Render dashboard: New > Blueprint > connect repo Gautam825406/clinic-ai-assistant.
# No real credentials here: simulated mode runs with zero keys; add real keys
# in Render > Environment only when the user supplies them.
services:
  - type: web
    name: clinic-ai-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-ai-assistant-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: TELEPHONY_API_KEY
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
databases:
  - name: clinic-ai-assistant-db
    plan: free
    databaseName: clinic
    user: clinic
